<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trips — magic soul travel</title>
  <meta name="description" content="GPX flight tracks over the Lesser Antilles — Le Diamant, Castries, Barbados and more.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="header-slot"></div>

  <main class="page-wrapper">
    <div class="sections-wrapper">
      <section class="section">
        <h2>trips</h2>
        <p class="hint">click any trip title to expand notes · red lines show flight tracks · <a href="trips-map.html">view all on map</a></p>
        <div class="trip-grid" id="trip-grid"></div>
      </section>
    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/gpx-maps.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tripGrid = document.getElementById('trip-grid');
      if (!tripGrid) return;

      let trips = [];
      try {
        trips = await (await fetch('assets/data/trips.json')).json();
      } catch (e) {
        tripGrid.innerHTML = '<p class="text-dim">could not load trips</p>';
        return;
      }

      if (trips.length === 0) {
        tripGrid.innerHTML = '<p class="text-dim">no trips yet</p>';
        return;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Render trip cards in grid
      tripGrid.innerHTML = trips.map(trip => {
        const page = trip.page || `trip-${trip.id}.html`;
        return `
          <div class="trip-card" id="${trip.id}">
            <div class="trip-card-body">
              <h3 class="trip-title"><a href="${page}">${escapeHtml(trip.title)}</a></h3>
              <p class="trip-meta">date: ${trip.date || '—'} · ${trip.activity || ''}</p>
              <p class="trip-description">${trip.description || ''}</p>
              <div id="map-${trip.id}" class="trip-map" data-gpx="${trip.file}"></div>
              <div class="trip-actions">
                <a href="${page}" class="btn btn-sm">explore</a>
              </div>
              ${trip.related_vid ? `
              <div class="related-videos">
                <h4>Related Videos</h4>
                ${trip.related_vid.split(',').map(vid => {
                  const v = vid.trim();
                  if (v.startsWith('https://')) {
                    const vidId = v.replace('https://www.youtube.com/watch?v=', '');
                    return `<div class="video-link"><a href="${v}" target="_blank" rel="noopener noreferrer"><img src="https://img.youtube.com/vi/${vidId}/maxresdefault.jpg" width="100%" alt="Related video"></a></div>`;
                  }
                  return `<div class="video-link">${vid}</div>`;
                }).join('')}
              </div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      // Lazy-load maps using IntersectionObserver
      const mapObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const mapDiv = entry.target;
            const gpxPath = mapDiv.dataset.gpx;
            if (gpxPath) {
              MST_MAPS.renderTrack(mapDiv.id, gpxPath);
            }
            mapObserver.unobserve(mapDiv);
          }
        });
      }, { rootMargin: '100px' });

      tripGrid.querySelectorAll('.trip-map').forEach(map => mapObserver.observe(map));
    });
  </script>
</body>
</html>
