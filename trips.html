<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trips — magic soul travel</title>
  <meta name="description" content="GPX flight tracks over the Lesser Antilles — Le Diamant, Castries, Barbados and more.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="header-slot"></div>

  <main class="page-wrapper">
    <div class="sections-wrapper">
      <section class="section">
        <h2>trips</h2>
        <p class="hint">click any trip title to expand notes · red lines show flight tracks · <a href="trips-map.html">view all on map</a></p>
        <div class="carousel-container trip-carousel-container" id="trip-carousel">
          <button class="carousel-control prev-btn" aria-label="Previous trip">&lt;</button>
          <div class="carousel-inner">
            <!-- carousel-group divs will be inserted here -->
          </div>
          <button class="carousel-control next-btn" aria-label="Next trip">&gt;</button>
          <div class="carousel-dots">
            <!-- dots will be inserted here -->
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/gpx-maps.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const carouselContainer = document.getElementById('trip-carousel');
      if (!carouselContainer) return;

      let trips = [];
      try {
        trips = await (await fetch('assets/data/trips.json')).json();
      } catch (e) {
        carouselContainer.innerHTML = '<p class="text-dim">could not load trips</p>';
        return;
      }

      if (trips.length === 0) {
        carouselContainer.innerHTML = '<p class="text-dim">no trips yet</p>';
        return;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Generate card templates
      const cardTemplates = trips.map(trip => {
        const page = trip.page || `trip-${trip.id}.html`;
        return `
          <div class="trip-card" id="${trip.id}">
            <div class="trip-card-body">
              <h3 class="trip-title"><a href="${page}">${escapeHtml(trip.title)}</a></h3>
              <p class="trip-meta">date: ${trip.date || '—'} · ${trip.activity || ''}</p>
              <p class="trip-description">${trip.description || ''}</p>
              <div id="map-${trip.id}" class="trip-map" data-gpx="${trip.file}"></div>
              <div class="trip-actions">
                <a href="${page}" class="btn btn-sm">explore</a>
              </div>
              ${trip.related_vid ? `
              <div class="related-videos">
                <h4>Related Videos</h4>
                ${trip.related_vid.split(',').map(vid => {
                  const v = vid.trim();
                  if (v.startsWith('https://')) {
                    const vidId = v.replace('https://www.youtube.com/watch?v=', '');
                    return `<div class="video-link"><a href="${v}" target="_blank" rel="noopener noreferrer"><img src="https://img.youtube.com/vi/${vidId}/maxresdefault.jpg" width="100%" alt="Related video"></a></div>`;
                  }
                  return `<div class="video-link">${vid}</div>`;
                }).join('')}
              </div>` : ''}
            </div>
          </div>
        `;
      });

      // Group cards into sets of 2 for carousel slides
      const groups = [];
      for (let i = 0; i < cardTemplates.length; i += 2) {
        const groupCards = cardTemplates.slice(i, i + 2);
        groups.push('<div class="carousel-group">' + groupCards.join('') + '</div>');
      }

      // Insert groups into carousel inner
      const inner = carouselContainer.querySelector('.carousel-inner');
      inner.innerHTML = groups.join('');

      // Lazy-load maps using IntersectionObserver on carousel groups
      const mapObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const group = entry.target;
            const maps = group.querySelectorAll('.trip-map');
            maps.forEach(map => {
              const gpxPath = map.dataset.gpx;
              if (gpxPath) {
                MST_MAPS.renderTrack(map.id, gpxPath);
              }
            });
            mapObserver.unobserve(group);
          }
        });
      }, { rootMargin: '100px' });

      // Observe all groups for map lazy-loading
      const allGroups = inner.querySelectorAll('.carousel-group');
      allGroups.forEach(group => mapObserver.observe(group));

      // Initialize carousel with autoplay
      const carousel = MST.initCarousel(carouselContainer);
      if (!carousel) return;

      // --- Continuous smooth autoscroll (RAF-based, no more stop-and-go) ---
      const scrollSpeed = 35; // px/sec — gentle seamless glide
      const origTransition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
      inner.style.transition = 'none'; // RAF drives the transform during auto

      const autoscroll = MST.startContinuousAutoscroll(carousel, inner, carouselContainer, scrollSpeed);

      // Helper to temporarily allow a CSS-animated goTo, then resume RAF
      let snapTimeout = null;

      const snapTo = (index) => {
        autoscroll.pause();
        if (snapTimeout) clearTimeout(snapTimeout);
        inner.style.transition = origTransition;
        carousel.goTo(index);
        snapTimeout = setTimeout(() => {
          inner.style.transition = 'none';
          autoscroll.resume();
          snapTimeout = null;
        }, 550);
      };

      // Pause / resume on hover
      carouselContainer.addEventListener('mouseenter', () => autoscroll.pause());
      carouselContainer.addEventListener('mouseleave', () => {
        if (snapTimeout) return; // let the snap finish first
        autoscroll.resume();
      });

      // Override button listeners so they snap with animation
      carouselContainer.querySelector('.prev-btn')?.addEventListener('click', () => {
        snapTo(carousel.current() - 1);
      });
      carouselContainer.querySelector('.next-btn')?.addEventListener('click', () => {
        snapTo(carousel.current() + 1);
      });

      // Drag-to-navigate — grab the tile body (title + explore button excluded)
      let dragStartX = 0;
      let dragging = false;
      let dragMoved = false;
      let dragDelta = 0;

      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        document.body.style.userSelect = '';
        carouselContainer.style.cursor = '';
        if (dragMoved && Math.abs(dragDelta) > 60) {
          snapTo(carousel.current() + (dragDelta < 0 ? 1 : -1));
        } else {
          snapTo(carousel.current());
        }
        dragMoved = false;
        dragDelta = 0;
      };

      inner.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('.trip-title') || e.target.closest('.trip-actions')) return;
        autoscroll.pause();
        if (snapTimeout) { clearTimeout(snapTimeout); snapTimeout = null; }
        inner.style.transition = 'none';
        dragStartX = e.clientX;
        dragging = true;
        dragMoved = false;
        dragDelta = 0;
        document.body.style.userSelect = 'none';
        carouselContainer.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        dragDelta = e.clientX - dragStartX;
        if (Math.abs(dragDelta) > 6) dragMoved = true;
        const trackWidth = inner.clientWidth || 1;
        const pct = (dragDelta / trackWidth) * 100;
        inner.style.transform = `translateX(${-carousel.current() * 100 + pct}%)`;
      });

      document.addEventListener('mouseup', endDrag);
      carouselContainer.addEventListener('mouseleave', endDrag);
    });
  </script>
</body>
</html>
