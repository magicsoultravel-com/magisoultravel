<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — magic soul travel</title>
  <meta http-equiv="refresh" content="0; url=index.html">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="header-slot"></div>

  <main class="page-wrapper">
    <div class="sections-wrapper">
      <section class="section">
        <h2>redirecting</h2>
        <p class="hint">blog posts are now individual pages</p>
        <p class="text-dim">if you are not redirected automatically, <a href="index.html">click here</a>.</p>
        <div id="redirect-info" style="margin-top: 20px; padding: 10px; background: var(--bg-elev); border-radius: 4px;"></div>
      </section>
    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');
      const redirectInfo = document.getElementById('redirect-info');
      
      const postIdToSlug = {"8eee11b0ec888154": "lesser-antilles-regional-airlines-overview","4218a796ae566d7b": "lesser-antilles-regionar-airlnes-fleets","9a489c4d2a0faecd": "longhaul-connections-with-lesser-antilles","ed68f17ed42ee88e": "lesser-antilles-inter-island-ferry-connections","8ecdf894fe2ac957": "the-next-trip","1ce8ac53469e911a": "a-concise-global-overview-of-major-hurricane-typhoon-cyclone-monsoon-seasons-by-region","3b8255354e764ce2": "time-zones-without-daylight-saving"};
      
      if (postId && postIdToSlug[postId]) {
        const newUrl = `post-${postIdToSlug[postId]}.html`;
        setTimeout(() => { window.location.href = newUrl; }, 500);
        redirectInfo.innerHTML = `<p>Redirecting to: <a href="${newUrl}">${newUrl}</a></p>`;
      }
    });
  </script>
</body>
</html>
