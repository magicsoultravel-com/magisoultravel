<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Videos — magic soul travel</title>
  <meta name="description" content="All videos from the magic soul travel YouTube channel.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .video-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    
    .video-item {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    
    .video-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-color: var(--accent);
    }
    
    .video-link {
      display: flex;
      text-decoration: none;
      color: inherit;
    }
    
    .video-thumbnail {
      position: relative;
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      background-color: var(--border);
    }
    
    .video-duration {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    
    .video-views {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    
    .video-info {
      padding: 14px;
    }
    
    .video-title {
      margin: 0 0 8px;
      font-size: 1.1rem;
      color: var(--text);
      line-height: 1.3;
    }
    
    .video-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    
    .video-separator {
      opacity: 0.5;
    }
    
    @media (max-width: 600px) {
      .video-list {
        grid-template-columns: 1fr;
      }
      
      .video-thumbnail {
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <div id="header-slot"></div>

  <main class="page-wrapper">
    <div class="sections-wrapper">

      <section class="section">
        <h2>all videos</h2>
        <p class="hint">complete list of videos from the channel — click a video to watch</p>
        <div class="video-list" id="all-videos-list"><p class="loading">loading videos</p></div>
        <div style="margin-top: 24px;">
          <a class="btn" href="https://www.youtube.com/@magicsoultravel" target="_blank" rel="noopener noreferrer">visit our channel ↗</a>
        </div>
      </section>

    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Advanced CSV parser that handles quoted fields with embedded newlines
    function parseCSV(csvText) {
      const headers = [];
      const results = [];
      let currentField = '';
      let inQuotes = false;
      let row = [];
      let i = 0;
      
      // Remove BOM if present
      if (csvText.charCodeAt(0) === 0xFEFF) {
        csvText = csvText.slice(1);
      }
      
      while (i < csvText.length) {
        const char = csvText[i];
        
        if (inQuotes) {
          if (char === '"') {
            // Check if this is a doubled quote (escaped quote)
            if (i + 1 < csvText.length && csvText[i + 1] === '"') {
              currentField += '"';
              i += 2;
              continue;
            }
            inQuotes = false;
            i++;
            continue;
          }
          currentField += char;
          i++;
        } else {
          if (char === '"') {
            inQuotes = true;
            i++;
          } else if (char === ',') {
            row.push(currentField.trim());
            currentField = '';
            i++;
          } else if (char === '\n' || char === '\r') {
            // End of row
            if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
              i += 2; // Skip \r\n
            } else {
              i++;
            }
            row.push(currentField.trim());
            currentField = '';
            
            if (row.length > 0) {
              if (headers.length === 0) {
                // First row is headers
                row.forEach(h => headers.push(h.replace(/^\s*["']|["']\s*$/g, '')));
              } else {
                // Data row
                const video = {};
                headers.forEach((h, idx) => {
                  video[h] = row[idx] || '';
                });
                results.push(video);
              }
              row = [];
            }
          } else {
            currentField += char;
            i++;
          }
        }
      }
      
      // Handle last field if file doesn't end with newline
      if (row.length > 0 || currentField) {
        row.push(currentField.trim());
        const video = {};
        headers.forEach((h, idx) => {
          video[h] = row[idx] || '';
        });
        results.push(video);
      }
      
      return results;
    }

    function formatDuration(duration) {
      if (!duration) return '—';
      return duration.replace(/"/g, '');
    }

    function formatViews(views) {
      if (!views) return '—';
      const num = parseInt(views.replace(/,/g, ''), 10);
      return num.toLocaleString();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
      } catch {
        return dateStr;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const list = document.getElementById('all-videos-list');

      let csvText;
      try {
        const response = await fetch('assets/data/Magic-Soul-Travel.csv');
        csvText = await response.text();
      } catch (e) {
        list.innerHTML = '<p class="text-dim">could not load videos</p>';
        return;
      }

      let videos = [];
      try {
        videos = parseCSV(csvText);
      } catch (e) {
        list.innerHTML = '<p class="text-dim">could not parse video data</p>';
        return;
      }

      // Filter only available videos
      videos = videos.filter(v => v['Availability Status'] === 'available');

      if (videos.length === 0) {
        list.innerHTML = '<p class="text-dim">no videos yet</p>';
        return;
      }

      // Sort by position
      videos.sort((a, b) => parseInt(a.Position) - parseInt(b.Position));

      // Build video grid
      const fragment = document.createDocumentFragment();
      
      videos.forEach(video => {
        const videoId = video['Video ID'];
        const title = video['Video Title'];
        const duration = video['Duration'];
        const views = video['Views'];
        const publishDate = video['Publish Date'];
        const thumbnail = video['Thumbnail URL'];
        
        const videoItem = document.createElement('div');
        videoItem.className = 'video-item';
        
        videoItem.innerHTML = '<a href="https://www.youtube.com/watch?v=' + videoId + '" target="_blank" rel="noopener noreferrer" class="video-link">' +
          '<div class="video-thumbnail" style="background-image: url(\'' + thumbnail + '\')">' +
          '<span class="video-duration">' + formatDuration(duration) + '</span>' +
          '<span class="video-views">' + formatViews(views) + ' views</span>' +
          '</div>' +
          '<div class="video-info">' +
          '<h3 class="video-title">' + title + '</h3>' +
          '<div class="video-meta">' +
          '<span class="video-date">' + formatDate(publishDate) + '</span>' +
          '<span class="video-separator">|</span>' +
          '<span class="video-duration-meta">' + formatDuration(duration) + '</span>' +
          '</div>' +
          '</div>' +
          '</a>';
        
        fragment.appendChild(videoItem);
      });

      list.innerHTML = '';
      list.appendChild(fragment);
    });
  </script>

</body>
</html>
