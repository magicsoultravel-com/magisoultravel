<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Videos — magic soul travel</title>
  <meta name="description" content="All videos from the magic soul travel YouTube channel.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .videos-header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .view-switcher {
      display: flex;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-btn:hover, .view-btn.active {
      background: var(--panel);
      color: var(--text);
    }

    .view-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* --- TILES VIEW (Grid) --- */
    .video-list.tiles-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .video-list.tiles-view .video-item {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .video-list.tiles-view .video-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-color: var(--accent);
    }

    .video-list.tiles-view .video-link {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      height: 100%;
    }

    .video-list.tiles-view .video-thumbnail {
      position: relative;
      width: 100%;
      height: 190px;
      background-size: cover;
      background-position: center;
      background-color: var(--border);
    }

    .video-list.tiles-view .video-info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- LIST VIEW --- */
    .video-list.list-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-list.list-view .video-item {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .video-list.list-view .video-item:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .video-list.list-view .video-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      gap: 16px;
      padding: 10px;
    }

    .video-list.list-view .video-thumbnail {
      position: relative;
      width: 160px;
      height: 90px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
      background-color: var(--border);
      border-radius: 6px;
    }

    .video-list.list-view .video-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0;
    }

    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .video-views {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .video-title {
      margin: 0 0 6px;
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.3;
    }

    .video-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .video-separator {
      opacity: 0.5;
    }

    .section-counter {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-left: 8px;
    }

    @media (max-width: 768px) {
      .video-list.list-view .video-thumbnail {
        width: 120px;
        height: 70px;
      }
      .videos-header-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .view-switcher {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="header-slot"></div>

  <main class="page-wrapper">
    <div class="sections-wrapper">

      <section class="section">
        <h2>all videos <span id="video-count" class="section-counter"></span></h2>
        <p class="hint">complete list of videos & shorts from the channel — click to watch</p>
        
        <div class="videos-header-controls">
          <div class="filter-tabs" id="filter-tabs">
            <button class="filter-btn active" data-filter="all">all videos</button>
            <button class="filter-btn" data-filter="normal">videos (<span id="count-normal">0</span>)</button>
            <button class="filter-btn" data-filter="shorts">shorts (<span id="count-shorts">0</span>)</button>
          </div>

          <div class="view-switcher" id="view-switcher">
            <button class="view-btn active" data-view="tiles" title="Tiles View">🔲 tiles</button>
            <button class="view-btn" data-view="list" title="List View">☰ list</button>
          </div>
        </div>

        <div class="video-list tiles-view" id="all-videos-list">
          <p class="loading">loading videos...</p>
        </div>

        <div style="margin-top: 32px; text-align: center;">
          <a class="btn" href="https://www.youtube.com/@magicsoultravel" target="_blank" rel="noopener noreferrer">visit our channel ↗</a>
        </div>
      </section>

    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function parseCSV(csvText) {
      const headers = [];
      const results = [];
      let currentField = '';
      let inQuotes = false;
      let row = [];
      let i = 0;
      
      if (csvText.charCodeAt(0) === 0xFEFF) {
        csvText = csvText.slice(1);
      }
      
      while (i < csvText.length) {
        const char = csvText[i];
        
        if (inQuotes) {
          if (char === '"') {
            if (i + 1 < csvText.length && csvText[i + 1] === '"') {
              currentField += '"';
              i += 2;
              continue;
            }
            inQuotes = false;
            i++;
            continue;
          }
          currentField += char;
          i++;
        } else {
          if (char === '"') {
            inQuotes = true;
            i++;
          } else if (char === ',') {
            row.push(currentField.trim());
            currentField = '';
            i++;
          } else if (char === '\n' || char === '\r') {
            if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
              i += 2;
            } else {
              i++;
            }
            row.push(currentField.trim());
            currentField = '';
            
            if (row.length > 0) {
              if (headers.length === 0) {
                row.forEach(h => headers.push(h.replace(/^\s*["']|["']\s*$/g, '')));
              } else {
                const video = {};
                headers.forEach((h, idx) => {
                  video[h] = row[idx] || '';
                });
                results.push(video);
              }
              row = [];
            }
          } else {
            currentField += char;
            i++;
          }
        }
      }
      
      if (row.length > 0 || currentField) {
        row.push(currentField.trim());
        const video = {};
        headers.forEach((h, idx) => {
          video[h] = row[idx] || '';
        });
        results.push(video);
      }
      
      return results;
    }

    function parseDurationSeconds(dur) {
      if (!dur) return 0;
      dur = dur.replace(/"/g, '').trim();
      const parts = dur.split(':').map(Number);
      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      } else if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }
      return parseInt(dur, 10) || 0;
    }

    function isShort(video) {
      const durSec = parseDurationSeconds(video['Duration']);
      const title = (video['Video Title'] || '').toLowerCase();
      return durSec <= 60 || title.includes('#shorts') || title.includes('#short');
    }

    function formatDuration(duration) {
      if (!duration) return '—';
      return duration.replace(/"/g, '');
    }

    function formatViews(views) {
      if (!views) return '—';
      const num = parseInt(views.replace(/,/g, ''), 10);
      return num.toLocaleString();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
      } catch {
        return dateStr;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const listEl = document.getElementById('all-videos-list');
      const countEl = document.getElementById('video-count');
      const countNormalEl = document.getElementById('count-normal');
      const countShortsEl = document.getElementById('count-shorts');

      let csvText;
      try {
        const response = await fetch('assets/data/Magic-Soul-Travel.csv');
        csvText = await response.text();
      } catch (e) {
        listEl.innerHTML = '<p class="text-dim">could not load videos</p>';
        return;
      }

      let allVideos = [];
      try {
        allVideos = parseCSV(csvText);
      } catch (e) {
        listEl.innerHTML = '<p class="text-dim">could not parse video data</p>';
        return;
      }

      // Filter available videos
      allVideos = allVideos.filter(v => v['Availability Status'] === 'available');
      allVideos.sort((a, b) => parseInt(a.Position) - parseInt(b.Position));

      if (allVideos.length === 0) {
        listEl.innerHTML = '<p class="text-dim">no videos yet</p>';
        return;
      }

      const shortsVideos = allVideos.filter(v => isShort(v));
      const normalVideos = allVideos.filter(v => !isShort(v));

      countNormalEl.textContent = normalVideos.length;
      countShortsEl.textContent = shortsVideos.length;
      countEl.textContent = `(${allVideos.length})`;

      let currentFilter = 'all';
      let currentView = 'tiles';

      function renderVideos() {
        let targetVideos = allVideos;
        if (currentFilter === 'normal') targetVideos = normalVideos;
        if (currentFilter === 'shorts') targetVideos = shortsVideos;

        if (targetVideos.length === 0) {
          listEl.innerHTML = '<p class="text-dim">no videos found in this category</p>';
          return;
        }

        const fragment = document.createDocumentFragment();

        targetVideos.forEach(video => {
          const videoId = video['Video ID'];
          const title = video['Video Title'];
          const duration = video['Duration'];
          const views = video['Views'];
          const publishDate = video['Publish Date'];
          const thumbnail = video['Thumbnail URL'];

          const item = document.createElement('div');
          item.className = 'video-item';

          item.innerHTML = `
            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener noreferrer" class="video-link">
              <div class="video-thumbnail" style="background-image: url('${thumbnail}')">
                <span class="video-duration">${formatDuration(duration)}</span>
                <span class="video-views">${formatViews(views)} views</span>
              </div>
              <div class="video-info">
                <h3 class="video-title">${title}</h3>
                <div class="video-meta">
                  <span class="video-date">${formatDate(publishDate)}</span>
                  <span class="video-separator">|</span>
                  <span class="video-duration-meta">${formatDuration(duration)}</span>
                </div>
              </div>
            </a>
          `;

          fragment.appendChild(item);
        });

        listEl.innerHTML = '';
        listEl.appendChild(fragment);
      }

      // Setup filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderVideos();
        });
      });

      // Setup view switcher
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentView = btn.dataset.view;
          
          if (currentView === 'tiles') {
            listEl.className = 'video-list tiles-view';
          } else {
            listEl.className = 'video-list list-view';
          }
        });
      });

      // Initial render
      renderVideos();
    });
  </script>

</body>
</html>
